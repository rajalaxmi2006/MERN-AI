<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-950 min-h-screen flex justify-center items-center">
    <div class="bg-gray-800 p-6 rounded-2xl w-80">

      <h1 class="text-white text-2xl text-center mb-5">Basic Calculator</h1>

      <input
        class="w-full p-4 mb-4 text-3xl text-right rounded-lg bg-gray-900 text-white"
        type="text"
        id="display"
        value="0"
        readonly
      />

      <div class="grid grid-cols-4 gap-3">
        <button onclick="clearDisplay()" class="btn bg-red-500">AC</button>
        <button onclick="deleteLast()" class="btn">DEL</button>
        <button onclick="append('%')" class="btn">%</button>
        <button onclick="append('/')" class="btn bg-blue-600">÷</button>

        <button onclick="append('7')" class="btn">7</button>
        <button onclick="append('8')" class="btn">8</button>
        <button onclick="append('9')" class="btn">9</button>
        <button onclick="append('*')" class="btn bg-blue-600">*</button>

        <button onclick="append('4')" class="btn">4</button>
        <button onclick="append('5')" class="btn">5</button>
        <button onclick="append('6')" class="btn">6</button>
        <button onclick="append('-')" class="btn bg-blue-600">-</button>

        <button onclick="append('1')" class="btn">1</button>
        <button onclick="append('2')" class="btn">2</button>
        <button onclick="append('3')" class="btn">3</button>
        <button onclick="append('+')" class="btn bg-blue-600">+</button>

        <button onclick="append('0')" class="btn col-span-2">0</button>
        <button onclick="append('.')" class="btn">.</button>
        <button onclick="calculate()" class="btn bg-green-600">=</button>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
