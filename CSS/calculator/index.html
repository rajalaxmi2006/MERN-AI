<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Modern Calculator</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-slate-950 flex items-center justify-center p-5">
    <!-- Calculator -->
    <div class="w-full max-w-sm">
      <!-- Calculator Card -->
      <div
        class="bg-slate-900 rounded-3xl shadow-2xl overflow-hidden border border-slate-800"
      >
        <!-- Header -->
        <div class="px-6 pt-6 pb-4">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-xs uppercase tracking-widest text-slate-500">
                Calculator
              </p>

              <h1 class="text-xl font-bold text-white">Basic Calculator</h1>
            </div>

            <!-- Calculator Icon -->
            <div
              class="w-10 h-10 rounded-xl bg-indigo-500/10 flex items-center justify-center border border-indigo-500/20"
            >
              <span class="text-indigo-400 text-lg"> ＋ </span>
            </div>
          </div>
        </div>

        <!-- Display -->
        <div class="px-5">
          <div
            class="bg-slate-950 rounded-2xl p-5 border border-slate-800 min-h-32 flex flex-col justify-end"
          >
            <!-- Previous Value -->
            <p class="text-right text-sm text-slate-500 mb-2">128 + 42</p>

            <!-- Main Display -->
            <p
              class="text-right text-4xl font-semibold text-white tracking-wide"
            >
              170
            </p>
          </div>
        </div>

        <!-- Calculator Buttons -->
        <div class="p-5">
          <div class="grid grid-cols-4 gap-3">
            <!-- Row 1 -->

            <button
              class="h-14 rounded-2xl bg-slate-800 text-slate-300 font-semibold hover:bg-slate-700 active:scale-95 transition"
            >
              AC
            </button>

            <button
              class="h-14 rounded-2xl bg-slate-800 text-slate-300 font-semibold hover:bg-slate-700 active:scale-95 transition"
            >
              ±
            </button>

            <button
              class="h-14 rounded-2xl bg-slate-800 text-slate-300 font-semibold hover:bg-slate-700 active:scale-95 transition"
            >
              %
            </button>

            <button
              class="h-14 rounded-2xl bg-indigo-500 text-white font-semibold hover:bg-indigo-400 active:scale-95 transition"
            >
              ÷
            </button>

            <!-- Row 2 -->

            <button
              class="h-14 rounded-2xl bg-slate-800 text-white text-lg font-semibold hover:bg-slate-700 active:scale-95 transition"
            >
              7
            </button>

            <button
              class="h-14 rounded-2xl bg-slate-800 text-white text-lg font-semibold hover:bg-slate-700 active:scale-95 transition"
            >
              8
            </button>

            <button
              class="h-14 rounded-2xl bg-slate-800 text-white text-lg font-semibold hover:bg-slate-700 active:scale-95 transition"
            >
              9
            </button>

            <button
              class="h-14 rounded-2xl bg-indigo-500 text-white font-semibold hover:bg-indigo-400 active:scale-95 transition"
            >
              ×
            </button>

            <!-- Row 3 -->

            <button
              class="h-14 rounded-2xl bg-slate-800 text-white text-lg font-semibold hover:bg-slate-700 active:scale-95 transition"
            >
              4
            </button>

            <button
              class="h-14 rounded-2xl bg-slate-800 text-white text-lg font-semibold hover:bg-slate-700 active:scale-95 transition"
            >
              5
            </button>

            <button
              class="h-14 rounded-2xl bg-slate-800 text-white text-lg font-semibold hover:bg-slate-700 active:scale-95 transition"
            >
              6
            </button>

            <button
              class="h-14 rounded-2xl bg-indigo-500 text-white font-semibold hover:bg-indigo-400 active:scale-95 transition"
            >
              −
            </button>

            <!-- Row 4 -->

            <button
              class="h-14 rounded-2xl bg-slate-800 text-white text-lg font-semibold hover:bg-slate-700 active:scale-95 transition"
            >
              1
            </button>

            <button
              class="h-14 rounded-2xl bg-slate-800 text-white text-lg font-semibold hover:bg-slate-700 active:scale-95 transition"
            >
              2
            </button>

            <button
              class="h-14 rounded-2xl bg-slate-800 text-white text-lg font-semibold hover:bg-slate-700 active:scale-95 transition"
            >
              3
            </button>

            <button
              class="h-14 rounded-2xl bg-indigo-500 text-white font-semibold hover:bg-indigo-400 active:scale-95 transition"
            >
              +
            </button>

            <!-- Row 5 -->

            <button
              class="h-14 rounded-2xl bg-slate-800 text-white text-lg font-semibold hover:bg-slate-700 active:scale-95 transition"
            >
              0
            </button>

            <button
              class="h-14 rounded-2xl bg-slate-800 text-white text-lg font-semibold hover:bg-slate-700 active:scale-95 transition"
            >
              .
            </button>

            <button
              class="h-14 rounded-2xl bg-slate-800 text-slate-300 font-semibold hover:bg-slate-700 active:scale-95 transition"
            >
              ⌫
            </button>

            <button
              class="h-14 rounded-2xl bg-emerald-500 text-white text-lg font-bold hover:bg-emerald-400 active:scale-95 transition"
            >
              =
            </button>
          </div>
        </div>

        <!-- Footer -->
        <div class="px-5 pb-5">
          <div class="text-center">
            <p class="text-xs text-slate-600">Built with HTML & Tailwind CSS</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
