<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex demo</title>

    <style>
      .container {
        display: flex;
        border: 2px solid;
        padding: 20px;
      }

      .sub-container {
        width: 500px;
        border: 2px solid red;
        display: flex;
        flex-direction: column;
        /* flex-direction: row; */
        /* justify-content: space-between;
        justify-content: space-around;
        justify-content: space-evenly; */
        /* align-items: center;
        align-items: end;
        align-items: start; */
        /* flex-wrap: wrap;
        flex-wrap: nowrap; */
        /* flex-direction: row-reverse; */
      }

      .circle {
        width: 100px;
        height: 100px;
        border: 2px solid;
        font-size: 1.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .circle-1 {
        background-color: aqua;
        /* order: 2;
        flex-grow: 1; */
      }
      .circle-2 {
        background-color: blueviolet;
        /* order: 3;
        flex-grow: 2; */
        align-self: center;
      }
      .circle-3 {
        background-color: blue;
        /* order: 1; */
        /* flex-grow: 3; */
        align-self: flex-end;
      }
    </style>
  </head>
  <body>
    <h1>Flex Demo</h1>

    <div class="container">
      <div class="sub-container">
        <div class="circle circle-1">1</div>
        <div class="circle circle-2">2</div>
        <div class="circle circle-3">3</div>
      </div>
    </div>
  </body>
</html>
