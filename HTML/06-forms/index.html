<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
  </head>

  <body>
    <h1 align="center">🎓 Student Registration Form</h1>

    <form
      action="./submit.html"
      style="
        width: 500px;
        border: 2px solid black;
        border-radius: 10px;
      "
    >
      <!-- Name -->
      <label for="name"><strong>Full Name:</strong></label
      ><br />
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your full name"
        required
      />
      <br /><br />

      <!-- Email -->
      <label for="email"><strong>Email Address:</strong></label
      ><br />
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      />
      <br /><br />

      <!-- Password -->
      <label for="password"><strong>Password:</strong></label
      ><br />
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Create password"
        required
      />
      <br /><br />

      <!-- Phone -->
      <label for="phone"><strong>Phone Number:</strong></label
      ><br />
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter mobile number"
        required
      />
      <br /><br />

      <!-- Date of Birth -->
      <label for="dob"><strong>Date of Birth:</strong></label
      ><br />
      <input type="date" id="dob" name="dob" required />
      <br /><br />

      <!-- Course -->
      <label for="course"><strong>Select Course:</strong></label
      ><br />

      <select id="course" name="course" required>
        <option value="">-- Select Course --</option>
        <option value="frontend">Frontend Development</option>
        <option value="backend">Backend Development</option>
        <option value="fullstack">Full Stack Development</option>
        <option value="ai">AI Development</option>
      </select>

      <br /><br />

      <!-- Gender -->
      <strong>Gender:</strong><br />

      <input type="radio" id="male" name="gender" value="Male" />
      <label for="male">Male</label>

      <input type="radio" id="female" name="gender" value="Female" />
      <label for="female">Female</label>

      <input type="radio" id="other" name="gender" value="Other" />
      <label for="other">Other</label>

      <br /><br />

      <!-- Skills -->
      <strong>Skills:</strong><br />

      <input type="checkbox" id="html" name="skills" value="HTML" />
      <label for="html">HTML</label>

      <input type="checkbox" id="css" name="skills" value="CSS" />
      <label for="css">CSS</label>

      <input type="checkbox" id="javascript" name="skills" value="JavaScript" />
      <label for="javascript">JavaScript</label>

      <input type="checkbox" id="react" name="skills" value="React" />
      <label for="react">React</label>

      <br /><br />

      <!-- Upload Resume -->
      <label for="resume"><strong>Upload Resume:</strong></label
      ><br />

      <input type="file" id="resume" name="resume" />

      <br /><br />

      <!-- Address -->
      <label for="address"><strong>Address:</strong></label
      ><br />

      <textarea
        id="address"
        name="address"
        rows="4"
        cols="40"
        placeholder="Enter your address"
      ></textarea>

      <br /><br />

      <!-- Feedback -->
      <label for="rating"><strong>Course Interest Level:</strong></label
      ><br />

      Low
      <input type="range" id="rating" name="interest" min="1" max="10" />
      High

      <br /><br />

      <!-- Terms -->
      <input type="checkbox" id="terms" name="terms" required />

      <label for="terms"> I agree to the Terms & Conditions </label>

      <br /><br />

      <!-- Buttons -->
      <input type="submit" value="Register" />

      <input type="reset" value="Reset Form" />
    </form>
  </body>
</html>
