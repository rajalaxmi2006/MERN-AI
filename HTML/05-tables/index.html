<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>05-Tables</title>
  </head>
  <body>
    <h1>Tables in HTML</h1>

    <table border="2px">
      <tr>
        <th>Name</th>
        <th>Course</th>
        <th>City</th>
      </tr>
      <tr>
        <td>Pramod</td>
        <td>MERN+AI</td>
        <td>Bhubaneswar</td>
      </tr>
      <tr>
        <td>Pramod</td>
        <td>MERN+AI</td>
        <td>Bhubaneswar</td>
      </tr>
      <tr>
        <td>Pramod</td>
        <td>MERN+AI</td>
        <td>Bhubaneswar</td>
      </tr>
      <tr>
        <td>Pramod</td>
        <td>MERN+AI</td>
        <td>Bhubaneswar</td>
      </tr>
    </table>

    <br />
    <br />
    <hr />
    <br />
    <br />

    <!-- table - Create table 
    tr - Table row 
    th - Table head 
    td - Table data
    caption - Table caption
    thead - Header section 
    tbody - Body section 
    tfoot - Footer section 
    -->

    <!-- Todo - Create a table for student list -->

    <table border="2px">
      <caption>
        Code Kariba MERN+AI Batch List
      </caption>
      <thead>
        <tr>
          <th scope="row">Name</th>
          <th scope="row">Course</th>
          <th scope="row">City</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Pramod</th>
          <td>MERN</td>
          <td>Bhubaneswar</td>
        </tr>
        <tr>
          <th scope="row">Pramod</th>
          <td>MERN</td>
          <td>Bhubaneswar</td>
        </tr>
        <tr>
          <th scope="row">Pramod</th>
          <td>MERN</td>
          <td>Bhubaneswar</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th scope="row">Total Students</th>
          <td colspan="2">3</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
