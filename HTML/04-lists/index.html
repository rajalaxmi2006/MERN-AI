<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>04-List</title>
  </head>
  <body>
    <h1>HTML List Items</h1>

    <div id="container" style="border: 5px solid">
      <div id="sub-container">
        <p>Student List</p>
      </div>
      <!-- List items -->
      <!-- Unordered list -->
      <!-- circle
       disc
       square -->
      <ul type="circle">
        <li>A</li>
        <li>B</li>
        <li>C</li>
        <li>D</li>
        <li>E</li>
      </ul>

      <!-- Ordered list -->
      <ol type="I">
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
      </ol>
    </div>

    <!-- Todo-1:  Create a student list of items using ordered list and unordered list -->
     
  </body>
</html>
